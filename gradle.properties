# Minecraft / 加载器（26.3）
minecraft_version=26.3
minecraft_version_range=[26.3,)
neo_form_version=26.3-1
neoforge_version=26.3.0.12-beta
neoforge_loader_version_range=[4,)
fabric_loader_version=0.19.5
# 运行时最低要求：Quilt Loader 的 Fabric 兼容层对外声明的是 fabricloader 0.18.6，
# 写 0.19.5 会让 Quilt 直接拒绝加载。
fabric_loader_min_version=0.18.6
fabric_version=0.161.0+26.3
# Quilt 不是依赖：这个版本号只用于编译 QuiltPlatform，让它直接向 Quilt 询问加载器名称与版本。
# 类由运行中的 Quilt Loader 提供，不会打包进 jar。
quilt_loader_version=0.30.0-beta.7
java_version=25

mod_id=cursorkit
mod_name=Cursor Kit
mod_version=0.1.0+26.3
mod_authors=Fragmented_Chaos
license=LGPL-3.0
credits=https://github.com/Fragmented-Chaos/Cursor-Kit
# Gradle 按 ISO-8859-1 读 gradle.properties，值里直接写中文会变成乱码，故用 \uXXXX 转义。
# 明文：把 Minecraft 的鼠标指针换成完全自定义的高清光标：光标集来自资源包 / 光标包 / config 目录，支持六个状态、帧动画、逐状态热区，以及随包切换的点击特效（波纹 / 爆开 / 脉冲 / 自定义图片）。纯客户端、无前置依赖，光标包可直接拖进界面安装。
description=\u628a Minecraft \u7684\u9f20\u6807\u6307\u9488\u6362\u6210\u5b8c\u5168\u81ea\u5b9a\u4e49\u7684\u9ad8\u6e05\u5149\u6807\uff1a\u5149\u6807\u96c6\u6765\u81ea\u8d44\u6e90\u5305 / \u5149\u6807\u5305 / config \u76ee\u5f55\uff0c\u652f\u6301\u516d\u4e2a\u72b6\u6001\u3001\u5e27\u52a8\u753b\u3001\u9010\u72b6\u6001\u70ed\u533a\uff0c\u4ee5\u53ca\u968f\u5305\u5207\u6362\u7684\u70b9\u51fb\u7279\u6548\uff08\u6ce2\u7eb9 / \u7206\u5f00 / \u8109\u51b2 / \u81ea\u5b9a\u4e49\u56fe\u7247\uff09\u3002\u7eaf\u5ba2\u6237\u7aef\u3001\u65e0\u524d\u7f6e\u4f9d\u8d56\uff0c\u5149\u6807\u5305\u53ef\u76f4\u63a5\u62d6\u8fdb\u754c\u9762\u5b89\u88c5\u3002\nReplaces Minecraft's mouse pointer with fully custom HD cursors from resource packs, cursor packs or the config folder, with six states, frame animation, per-state hotspots, and pack-provided click effects (ripple / burst / pulse / custom image). Client-side only, no dependencies; drag a cursor pack into the screen to install it.
maven_group=com.fragmentedchaos.cursorkit
group=com.fragmentedchaos.cursorkit

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
